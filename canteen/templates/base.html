<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Bhukkad Box{% endblock %}</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    {% load static %}
    <link rel="icon" href="https://bhukkadbox.in/favicon.ico" />
    <link rel="stylesheet" href="{% static 'css/customer_home.css' %}" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bhukkad Box",
      "alternateName": "BhukkadBox",
      "url": "https://bhukkadbox.in",
      "logo": "https://bhukkadbox.in/logo.png"
    }
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{% static 'js/customer_home.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
